<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
<head lang="en">
    <meta charset="UTF-8"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Acebook</title>
    <link rel="stylesheet" href="/main.css" />
</head>
<body>

<h1>Edit comment</h1>

<div sec:authorize="isAuthenticated()" id="greeting">
    Signed in as <span sec:authentication="principal.attributes['email']"></span>
</div>

<form action="#" th:action="@{/comment/__${comment.post.id}__/__${comment.id}__}" th:object="${comment}" method="post">
    <p>Content: <input type="text" th:field="*{content}" th:id="new-comment-content" /></p>
    <p><input id="submit-new-comment" type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
</form>

</body>
</html>
