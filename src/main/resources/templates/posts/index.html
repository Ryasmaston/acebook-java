<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
    <head lang="en">
        <meta charset="UTF-8"/>
        <title>Acebook</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>

    <h1>Posts</h1>

    <div sec:authorize="isAuthenticated()" id="greeting">
        Signed in as <span sec:authentication="principal.attributes['email']"></span>
    </div>

    <form action="#" th:action="@{/posts}" th:object="${post}" method="post">
        <p>Content: <input type="text" th:field="*{content}" th:id="new-post-content" /></p>
        <p><input id="submit-new-post" type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
    </form>

    <ul>
        <div th:each="post: ${posts}">
            <li th:id="'post-' + ${post.id}" th:text="${post.content}"></li>
            <a  th:id="'edit-' + ${post.id}" th:href="@{'/edit/' + ${post.id}}" th:object="${post}" role="button">
                <button th:disabled="${post.user!=user}">Edit</button>
            </a>
        </div>
    </ul>

    </body>
</html>
