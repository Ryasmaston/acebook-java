<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
    <head lang="en">
        <meta charset="UTF-8"/>
        <title>Acebook</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>

    <h1>Posts</h1>

    <form th:action="@{/logout}" method="post" id="logout-form">
        <button type="submit" id="signout-button">Sign out</button>
    </form>

    <div sec:authorize="isAuthenticated()" id="greeting">
        Signed in as <span sec:authentication="principal.attributes['email']"></span>

    </div>

    <form action="#" th:action="@{/posts}" th:object="${post}" method="post">
        <p>Content: <input type="text" th:field="*{content}" th:id="new-post-content" /></p>
        <p><input id="submit-new-post" type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
    </form>

    <ul>
        <div th:each="post: ${posts}">
            <li th:id="'post-' + ${post.id}" th:text="${post.content}"></li>
            <div id="post-buttons" th:if="${post.user != null and post.user.username == #authentication.principal.attributes['email']}" style="display: inline-flex">
                <a  th:id="'edit-' + ${post.id}" th:href="@{'/edit/' + ${post.id}}" th:object="${post}" role="button">
                    <button>Edit</button>
                </a>
              <form 
                  th:action="@{/posts/{id}/delete(id=${post.id})}"
                  method="post">
                <button type="submit" th:id="'delete-post-' + ${post.id}">Delete</button>
              </form>
            </div>
        </div>
    </ul>

    </body>
</html>
